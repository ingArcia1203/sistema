<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2>Usuarios Registrados</h2>
    <table class="table table-striped mt-3">
        <thead>
            <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Cédula</th>
            </tr>
        </thead>
        <tbody>
            {% for u in usuarios %}
            <tr>
                <td><strong>{{ u.codigo_usuario }}</strong></td>
                <td>{{ u.nombre }}</td>
                <td>{{ u.apellido }}</td>
                <td>{{ u.cedula }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4" class="text-center">No hay usuarios registrados aún.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <a href="{% url 'registrar_usuario' %}" class="btn btn-primary">Registrar Nuevo Usuario</a>
</body>
</html>
